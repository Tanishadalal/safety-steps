<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Meta tags for responsive layout -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safety Steps - Welcome</title>

  <!-- Bootstrap and FontAwesome CDN links -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <!-- Custom Styling -->
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #141e30, #243b55);
      color: white;
    }

    .welcome-section {
      height: 100vh;
      background: url('https://cdn.pixabay.com/photo/2019/09/08/08/27/woman-4453988_1280.jpg') no-repeat center center/cover;
      background-color: rgba(0, 0, 0, 0.7);
      background-blend-mode: overlay;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      position: relative;
    }

    .icon-row i {
      font-size: 2rem;
      margin: 10px;
      color: #ffd700;
    }

    .btn-start {
      background-color: #ffd700;
      color: #000;
      font-weight: 600;
      padding: 12px 30px;
      border-radius: 50px;
      border: none;
      margin-top: 20px;
    }

    .btn-start:hover {
      background-color: #ffcc00;
    }

    .footer-text {
      position: absolute;
      bottom: 10px;
      font-size: 0.9rem;
      color: #ccc;
    }
  </style>
</head>

<body>
  <!-- Welcome Section (First Page) -->
  <section class="welcome-section">
    <h1 class="display-4 fw-bold">Welcome to Safety Steps</h1>
    <p class="lead">Empowering your safety, wherever you go.</p>

    <!-- Feature Icons Row -->
    <div class="icon-row">
      <i class="fas fa-map-marked-alt"></i>
      <i class="fas fa-user-shield"></i>
      <i class="fas fa-bell"></i>
      <i class="fas fa-route"></i>
      <i class="fas fa-phone-alt"></i>
    </div>

    <!-- Start Button to Login Page -->
    <a href="login.html" class="btn btn-start">Get Started</a>

    <!-- Footer Credit Text -->
    <p class="footer-text">&copy; 2025 SafetySteps | Designed with <span style="color:red;">&hearts;</span></p>
  </section>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
