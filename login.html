<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Safety Steps</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      color: white;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-box {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.4);
    }

    .form-control {
      background-color: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
    }

    .form-control::placeholder {
      color: #ddd;
    }

    .btn-login {
      background-color: #ffd700;
      color: #000;
      border: none;
    }

    .btn-login:hover {
      background-color: #ffcc00;
      color: #000;
    }

    .or-divider {
      text-align: center;
      margin: 20px 0;
      color: #aaa;
    }

    .login-header {
      text-align: center;
      margin-bottom: 15px;
    }

    .login-header i {
      font-size: 3rem;
      color: #ffd700;
    }
  </style>
</head>

<body>
  <!-- Login Box -->
  <div class="login-box">
    <!-- Icon and Welcome -->
    <div class="login-header">
      <i class="fas fa-user-lock"></i>
      <h2 class="mt-2">Login to Safety Steps</h2>
      <p class="text-light">Your journey to safe movement starts here</p>
    </div>

    <!-- Gmail Login -->
    <form action="userinfo.html">
      <div class="mb-3">
        <label for="gmail" class="form-label">Gmail</label>
        <input type="email" class="form-control" id="gmail" placeholder="Enter your Gmail">
      </div>
      <div class="mb-3">
        <label for="gmail-pass" class="form-label">Password</label>
        <input type="password" class="form-control" id="gmail-pass" placeholder="Enter your Password">
      </div>
      <button type="submit" class="btn btn-login w-100">
        <i class="fas fa-envelope"></i> Continue with Gmail
      </button>
    </form>

    <!-- OR Divider -->
    <div class="or-divider">OR</div>

    <!-- Phone Login (Send OTP + Show OTP field after click) -->
    <form action="userinfo.html" onsubmit="return false">
      <div class="mb-3">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="tel" class="form-control" id="phone" placeholder="Enter phone number">
      </div>
      <div class="mb-3 text-center">
        <button type="button" class="btn btn-login" onclick="showOtpField()">
          <i class="fas fa-paper-plane"></i> Send OTP
        </button>
      </div>
      <div class="mb-3" id="otp-section" style="display: none;">
        <label for="otp" class="form-label">Enter OTP</label>
        <input type="number" class="form-control" id="otp" placeholder="Enter OTP">
        <button type="submit" class="btn btn-login w-100 mt-3" onclick="location.href='userinfo.html'">
          <i class="fas fa-phone"></i> Login with OTP
        </button>
      </div>
    </form>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Function to show OTP input field after clicking Send OTP
    function showOtpField() {
      document.getElementById("otp-section").style.display = "block";
    }
  </script>
</body>

</html>
