<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Information - Safety Steps</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #e0c3fc, #8ec5fc); /* Calming lavender to soft blue gradient */
      font-family: 'Segoe UI', sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .info-box {
      background-color: rgba(0, 0, 0, 0.3);
      padding: 30px;
      border-radius: 15px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.3);
    }

    .form-control, .form-select {
      background-color: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
    }

    .form-control::placeholder, .form-select option {
      color: #eee;
    }

    .form-select option {
      background-color: #333;
      color: white;
    }

    .btn-next {
      background-color: #ffd700;
      color: black;
      font-weight: bold;
      border: none;
    }

    .btn-next:hover {
      background-color: #ffcc00;
    }

    label {
      font-weight: 500;
    }
  </style>
</head>

<body>
  <div class="info-box">
    <h3 class="text-center mb-4">Fill Your Safety Info</h3>
    <form action="dashboard.html">
      <div class="mb-3">
        <label for="name" class="form-label">Name <span style="color: black">*</span></label>
        <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
      </div>
      <div class="mb-3">
        <label for="age" class="form-label">Age</label>
        <input type="number" class="form-control" id="age" placeholder="Enter your age" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Gender</label><br>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="male" value="male">
          <label class="form-check-label" for="male">Male</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="female" value="female">
          <label class="form-check-label" for="female">Female</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="other" value="other">
          <label class="form-check-label" for="other">Other</label>
        </div>
      </div>
      <div class="mb-3">
        <label for="relation" class="form-label">Emergency Contact Relation</label>
        <select class="form-select" id="relation" required>
          <option selected disabled value="">Choose relation</option>
          <option value="Parents">Parents</option>
          <option value="Siblings">Siblings</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="emergency-name" class="form-label">Emergency Contact Name</label>
        <input type="text" class="form-control" id="emergency-name" placeholder="Enter emergency contact name" required>
      </div>
      <div class="mb-3">
        <label for="emergency" class="form-label">Emergency Contact Number <span style="color: black">*</span></label>
        <input type="tel" class="form-control" id="emergency" placeholder="Enter emergency number" required>
      </div>
      <button type="submit" class="btn btn-next w-100">Get Started</button>
    </form>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
